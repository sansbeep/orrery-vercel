<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1a">
<title>ORRERY — a duel of dice, decrees &amp; planetary law</title>
<meta name="description" content="ORRERY: a quick-to-learn, deep-to-master multiplayer strategy game of drafted dice, secret placement and planetary Laws.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a0e22'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23c9a86a' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23f5c95a'/%3E%3Ccircle cx='54' cy='32' r='5' fill='%235cc8ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
  <section id="screen-menu" class="screen"></section>
  <section id="screen-lobby" class="screen hidden"></section>
  <section id="screen-game" class="screen hidden">
    <header id="top" class="panel"></header>
    <aside id="players"></aside>
    <main id="stage">
      <div id="prompt"></div>
      <div id="board" class="board"></div>
      <div id="dock"><div id="well" class="panel well"></div><div id="satchel" class="panel satchel"></div><div id="hand"></div></div>
    </main>
    <aside id="side" class="panel"></aside>
  </section>
</div>
<div id="overlay"></div>
<div id="toasts"></div>
<noscript><p style="padding:2rem;color:#fff">ORRERY needs JavaScript to run.</p></noscript>
<script src="config.js"></script>
<script src="vendor/socket.io.min.js"></script>
<script src="rules.js"></script>
<script src="glyphs.js"></script>
<script src="fx.js"></script>
<script src="net.js"></script>
<script src="app-core.js"></script>
<script src="app-render.js"></script>
<script src="app-main.js"></script>
</body>
</html>
